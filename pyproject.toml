[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadsift"
version = "0.1.0"
description = "Offline, reproducible lead-prioritization and CRM record-deduplication engine with honest benchmarks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Khadija" }]
keywords = [
    "sales-crm",
    "lead-scoring",
    "lead-prioritization",
    "deduplication",
    "data-quality",
    "record-linkage",
    "ranking-metrics",
    "benchmark",
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[project.scripts]
leadsift = "leadsift.cli:main"

[project.urls]
Homepage = "https://github.com/KhadijaDurrany-svg/sales-crm"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leadsift = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
